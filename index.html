<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Pro Business Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; padding: 20px; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .total-banner { background: #1e2a38; color: white; padding: 30px; border-radius: 15px; margin-bottom: 25px; position: relative; }
        .blur-text { filter: blur(10px); cursor: pointer; transition: 0.3s; }
        .hidden { display: none; }
        #loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
        }
        .nav-buttons { position: absolute; top: 15px; left: 15px; }
        .logout-btn { position: absolute; top: 15px; right: 15px; }
        .profit-label { font-weight: bold; color: #27ae60; background: #e8f5e9; padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3"><strong>Processing... Please wait</strong></p>
</div>

<div class="container">
    <div class="total-banner text-center">
        <div class="nav-buttons">
            <button onclick="showPage('sales')" class="btn btn-sm btn-light">🛒 View Sales</button>
            <button onclick="showPage('orders')" class="btn btn-sm btn-warning">📦 View Inventory</button>
        </div>
        <button onclick="logout()" class="btn btn-sm btn-danger logout-btn">🔒 System Lock</button>
        
        <p class="mb-1 text-uppercase small" id="bannerTitle">Total Outstanding Debt</p>
        <h1 id="totalBalance" class="blur-text">K0.00</h1>
        
        <div class="mt-2">
            <button onclick="toggleBalance()" class="btn btn-sm btn-outline-light" id="toggleBtn">Show Figure</button>
            <button onclick="showProfitSummary()" class="btn btn-sm btn-success">Calculate Total Profit</button>
        </div>
    </div>

    <div id="salesPage">
        <div class="card p-4">
            <h5 class="mb-3 text-secondary">Record a New Sale</h5>
            <div class="row g-3">
                <div class="col-md-2"><input type="text" id="name" class="form-control" placeholder="Name"></div>
                <div class="col-md-1"><input type="text" id="room" class="form-control" placeholder="Room"></div>
                <div class="col-md-2"><input type="text" id="phone" class="form-control" placeholder="Phone"></div>
                <div class="col-md-3"><select id="itemSelect" class="form-select"><option value="">Choose Item...</option></select></div>
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text">K</span>
                        <input type="number" id="cost" class="form-control" placeholder="Price">
                        <button onclick="addRecord()" class="btn btn-primary">Save Sale</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Customer (Room/Phone)</th>
                            <th>Item</th>
                            <th>Sale Price</th>
                            <th>Profit</th>
                            <th>Balance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="ordersPage" class="hidden">
        <div class="card p-4 border-warning">
            <h5 class="mb-3 text-warning">Inventory Entry</h5>
            <div class="row g-3">
                <div class="col-md-4"><input type="text" id="invItemName" class="form-control" placeholder="Item Name"></div>
                <div class="col-md-3"><input type="number" id="invOrderPrice" class="form-control" placeholder="Order price (K)"></div>
                <div class="col-md-2"><input type="number" id="invQty" class="form-control" placeholder="Quantity" value=""></div>
                <div class="col-md-3"><button onclick="addInventory()" class="btn btn-warning w-100">Add to Stock</button></div>
            </div>
        </div>
        <div class="card p-4">
            <h5 class="mb-3 text-secondary">Current Stock Valuation</h5>
            <table class="table table-hover">
                <thead class="table-light">
                    <tr><th>Item Name</th><th>Quantity</th><th>Unit Cost</th><th>Total Stock Value</th><th>Actions</th></tr>
                </thead>
                <tbody id="inventoryTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwfTh0jR2dBJkWlN_k3D-chnbaWx7ektFdQG6_1-6hDzEhHgSslTUnZDqQ_grRVS_lzmg/exec"; 
    const MASTER_PASSWORD = "shamenda@1421";
    let inventory = [];
    let lastSalesData = [];
    let currentPage = 'sales';

    function checkAuth() {
        if (localStorage.getItem("gadgetProAuth") !== MASTER_PASSWORD) {
            const auth = prompt("Admin Password:");
            if (auth === MASTER_PASSWORD) localStorage.setItem("gadgetProAuth", auth);
            else { document.body.innerHTML = "Unauthorized Access"; throw new Error(); }
        }
    }
    function logout() { localStorage.removeItem("gadgetProAuth"); location.reload(); }
    checkAuth();

    function showPage(page) {
        currentPage = page;
        document.getElementById('salesPage').classList.toggle('hidden', page !== 'sales');
        document.getElementById('ordersPage').classList.toggle('hidden', page !== 'orders');
        document.getElementById('bannerTitle').innerText = (page === 'sales') ? "Total Outstanding Debt" : "Total Inventory Value";
        loadData();
    }

    async function loadData() {
        toggleLoader(true);
        try {
            const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'readAll'}) });
            const data = await res.json();
            inventory = data.inventory || [];
            lastSalesData = data.sales || [];
            renderInventory(inventory);
            renderSales(lastSalesData);
            updateDropdown(inventory);
        } catch (e) { console.error(e); }
        toggleLoader(false);
    }

    function renderInventory(items) {
        let html = ""; let grandTotal = 0;
        items.forEach(i => {
            const total = (parseFloat(i.cost) || 0) * (parseFloat(i.qty) || 0);
            grandTotal += total;
            html += `<tr><td><strong>${i.name}</strong></td><td>${i.qty}</td><td>K${i.cost}</td><td><strong>K${total.toLocaleString()}</strong></td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="deleteInv('${i.name}')">Delete Stock</button></td></tr>`;
        });
        document.getElementById('inventoryTable').innerHTML = html;
        if (currentPage === 'orders') document.getElementById('totalBalance').innerText = "K" + grandTotal.toLocaleString();
    }

    function renderSales(sales) {
        let html = ""; let totalDebt = 0;
        sales.forEach(row => {
            const invItem = inventory.find(i => i.name === row[4]);
            const profit = (parseFloat(row[5]) || 0) - (invItem ? parseFloat(invItem.cost) : 0);
            totalDebt += (parseFloat(row[7]) || 0);
            html += `<tr><td><small>${row[8]}</small></td><td><strong>${row[1]}</strong><br><small>Rm: ${row[2]} | Ph: ${row[3]}</small></td>
            <td>${row[4]}</td><td>K${row[5]}</td><td><span class="profit-label">K${profit}</span></td><td class="text-danger"><strong>K${row[7]}</strong></td>
            <td><button class="btn btn-sm btn-success me-1" onclick="makePayment('${row[0]}')">Make Payment</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteSale('${row[0]}')">Delete Sale</button></td></tr>`;
        });
        document.getElementById('dataTable').innerHTML = html;
        if (currentPage === 'sales') document.getElementById('totalBalance').innerText = "K" + totalDebt.toLocaleString();
    }

    async function addInventory() {
        const name = document.getElementById('invItemName').value;
        const cost = document.getElementById('invOrderPrice').value;
        const qty = document.getElementById('invQty').value;
        if (!name || !cost) return;
        toggleLoader(true);
        await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'addInventory', name, cost, qty}) });
        document.getElementById('invItemName').value = ""; document.getElementById('invOrderPrice').value = "";
        await loadData(); // STAYS ON PAGE
    }

    async function addRecord() {
        toggleLoader(true);
        const payload = {
            action: 'addRow',
            name: document.getElementById('name').value, room: document.getElementById('room').value,
            phone: document.getElementById('phone').value, item: document.getElementById('itemSelect').value, cost: document.getElementById('cost').value
        };
        await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
        // Clear fields manually
        document.getElementById('name').value = ""; document.getElementById('room').value = ""; 
        document.getElementById('phone').value = ""; document.getElementById('cost').value = "";
        await loadData(); // STAYS ON PAGE
    }

    async function makePayment(id) {
        const amt = prompt("Amount Paid (K):");
        if (amt) { toggleLoader(true); await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'update', id: id, amount: amt}) }); await loadData(); }
    }

    async function deleteSale(id) { if(confirm("Delete Sale Record?")) { toggleLoader(true); await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'delete', id: id}) }); await loadData(); } }
    async function deleteInv(name) { if(confirm("Delete Stock Item?")) { toggleLoader(true); await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'deleteInventory', name: name}) }); await loadData(); } }

    function toggleLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
    function toggleBalance() { document.getElementById('totalBalance').classList.toggle('blur-text'); }
    function showProfitSummary() {
        let total = 0; lastSalesData.forEach(row => {
            const invItem = inventory.find(i => i.name === row[4]);
            total += (parseFloat(row[5]) - (invItem ? parseFloat(invItem.cost) : 0));
        });
        alert("Total Cumulative Profit: K" + total.toLocaleString());
    }
    function updateDropdown(items) {
        const s = document.getElementById('itemSelect'); s.innerHTML = '<option value="">Choose Item...</option>';
        items.forEach(i => s.innerHTML += `<option value="${i.name}">${i.name}</option>`);
    }

    loadData();
</script>
</body>
</html>
