<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Pro Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; padding: 20px; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .total-banner { background: #1e2a38; color: white; padding: 30px; border-radius: 15px; margin-bottom: 25px; position: relative; }
        .blur-text { filter: blur(12px); cursor: pointer; transition: 0.3s; }
        .hidden { display: none; }
        #loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
        }
        .item-scroll-area { max-height: 300px; overflow-y: auto; border: 1px solid #dee2e6; padding: 15px; border-radius: 8px; background: #fff; }
        .profit-label { font-weight: bold; color: #27ae60; background: #e8f5e9; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; }
        .order-price-tag { font-size: 0.75rem; color: #6c757d; display: block; }
        .details-sub { font-size: 0.8rem; color: #6c757d; display: block; margin-top: 2px; }
    </style>
</head>
<body>

<div id="loader"><div class="spinner-border text-primary"></div><p class="mt-2 fw-bold">Syncing...</p></div>

<div class="container">
    <div class="total-banner text-center">
        <div class="position-absolute top-0 start-0 m-3">
            <button onclick="showPage('sales')" class="btn btn-sm btn-light">🛒 Sales Desk</button>
            <button onclick="showPage('orders')" class="btn btn-sm btn-warning">📦 Stock Desk</button>
        </div>
        <button onclick="logout()" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-3">System Lock</button>
        <p class="mb-1 text-uppercase small" id="bannerTitle">Total Outstanding Debt</p>
        <h1 id="totalBalance" class="blur-text" onclick="this.classList.toggle('blur-text')">K0.00</h1>
        <div class="mt-2"><button onclick="showProfitSummary()" class="btn btn-sm btn-success">Profit Report</button></div>
    </div>

    <!-- SALES PAGE -->
    <div id="salesPage">
        <div class="card p-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="name" class="form-control mb-2" placeholder="Customer Name" required>
                    <input type="text" id="room" class="form-control mb-2" placeholder="Room/ID" required>
                    <input type="text" id="phone" class="form-control" placeholder="Phone">
                </div>
                <div class="col-md-8">
                    <label class="fw-bold mb-1 small">Select Items (Order Price shown)</label>
                    <div id="itemChecklist" class="item-scroll-area"></div>
                    <button onclick="addRecord()" class="btn btn-primary w-100 mt-3">Confirm Sale</button>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search sales (Name, Room, or Items)..." onkeyup="filterSales()">
        <div class="card p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Customer & Details</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Profit</th>
                            <th>Balance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- INVENTORY PAGE -->
    <div id="ordersPage" class="hidden">
        <div class="card p-4 border-warning">
            <div class="row g-3">
                <div class="col-md-4"><input type="text" id="invItemName" class="form-control" placeholder="Item Name"></div>
                <div class="col-md-3"><input type="number" id="invOrderPrice" class="form-control" placeholder="Order Price (K)"></div>
                <div class="col-md-2"><input type="number" id="invQty" class="form-control" value="1"></div>
                <div class="col-md-3"><button onclick="addInventory()" class="btn btn-warning w-100">Add Stock</button></div>
            </div>
        </div>
        <div class="card p-4">
            <table class="table table-hover">
                <thead><tr><th>Item</th><th>Qty</th><th>Order Price</th><th>Total Value</th><th>Action</th></tr></thead>
                <tbody id="inventoryTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbysu0G8HPB6SR1kl6Xij0c_RS2yU17H9VPTYmprlE_3W2gokvh7kto58i4GifW1cM_rwA/exec"; 
    const MASTER_PASSWORD = "shamenda@1421";
    let inventory = []; let lastSalesData = []; let currentPage = 'sales';

    function checkAuth() {
        if (localStorage.getItem("gadgetProAuth") !== MASTER_PASSWORD) {
            const auth = prompt("Admin Password:");
            if (auth === MASTER_PASSWORD) localStorage.setItem("gadgetProAuth", auth);
            else { document.body.innerHTML = "Unauthorized"; throw new Error(); }
        }
    }
    function logout() { localStorage.removeItem("gadgetProAuth"); location.reload(); }
    checkAuth();

    function showPage(page) {
        currentPage = page;
        document.getElementById('salesPage').classList.toggle('hidden', page !== 'sales');
        document.getElementById('ordersPage').classList.toggle('hidden', page !== 'orders');
        document.getElementById('bannerTitle').innerText = (page === 'sales') ? "Total Outstanding Debt" : "Total Inventory Value";
        loadData();
    }

    async function loadData() {
        toggleLoader(true);
        const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'readAll'}) });
        const data = await res.json();
        inventory = data.inventory || [];
        lastSalesData = data.sales || [];
        render();
        toggleLoader(false);
    }

    function render() {
        // --- 1. STOCK ---
        let invVal = 0; let invHtml = "";
        inventory.forEach(i => {
            invVal += (i.qty * i.cost);
            invHtml += `<tr><td>${i.name}</td><td>${i.qty}</td><td>K${i.cost}</td><td>K${(i.qty*i.cost).toLocaleString()}</td>
            <td><button class="btn btn-sm btn-danger" onclick="deleteInv('${i.name}')">Delete</button></td></tr>`;
        });
        document.getElementById('inventoryTable').innerHTML = invHtml;

        // --- 2. SALES ---
        let debt = 0; let salesHtml = "";
        lastSalesData.forEach(row => {
            const base = row[4].split(" (x")[0];
            const qty = row[4].split("(x")[1] ? parseFloat(row[4].split("(x")[1]) : 1;
            const inv = inventory.find(i => i.name === base);
            const prof = parseFloat(row[5]) - (inv ? inv.cost * qty : 0);
            debt += parseFloat(row[7]);

            // row[1] = Name, row[2] = Room, row[3] = Phone
            salesHtml += `<tr>
                <td>${row[8]}</td>
                <td>
                    <strong>${row[1]}</strong>
                    <span class="details-sub">Room: ${row[2] || 'N/A'}</span>
                    <span class="details-sub">Phone: ${row[3] || 'N/A'}</span>
                </td>
                <td>${row[4]}</td>
                <td>K${parseFloat(row[5]).toFixed(2)}</td>
                <td><span class="profit-label">K${prof.toFixed(2)}</span></td>
                <td class="text-danger">K${parseFloat(row[7]).toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-success" onclick="makePayment('${row[0]}')">Pay</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteSale('${row[0]}')">Delete</button>
                </td>
            </tr>`;
        });
        document.getElementById('dataTable').innerHTML = salesHtml;

        document.getElementById('totalBalance').innerText = "K" + (currentPage === 'sales' ? debt : invVal).toLocaleString();

        let checkHtml = "";
        inventory.forEach((item, idx) => {
            checkHtml += `<div class="d-flex align-items-center mb-2 border-bottom pb-2">
                <div class="flex-grow-1">
                    <input class="form-check-input item-cb" type="checkbox" value="${item.name}" id="cb${idx}">
                    <label class="ms-2" for="cb${idx}">${item.name}</label>
                    <span class="order-price-tag">Order Price: K${item.cost}</span>
                </div>
                <input type="number" class="form-control form-control-sm w-25 me-1" placeholder="Sell Price" id="p${idx}">
                <input type="number" class="form-control form-control-sm w-25" value="1" id="q${idx}"></div>`;
        });
        document.getElementById('itemChecklist').innerHTML = checkHtml;
    }

async function addRecord() {
    const nameVal = document.getElementById('name').value;
    const roomVal = document.getElementById('room').value;
    if (!nameVal || !roomVal) { alert("Customer Name and Room are required."); return; }

    let totalBill = 0;
    let itemStrings = [];

    document.querySelectorAll('.item-cb').forEach((cb, idx) => {
        if (cb.checked) {
            const sPrice = parseFloat(document.getElementById(`p${idx}`).value);
            const qty = parseFloat(document.getElementById(`q${idx}`).value) || 1;
            
            if (isNaN(sPrice)) { alert("Missing price for " + cb.value); throw "error"; }
            
            totalBill += (sPrice * qty);
            itemStrings.push(`${cb.value} (x${qty})`);
        }
    });

    if (itemStrings.length === 0) return;

    toggleLoader(true);
    await fetch(WEB_APP_URL, { 
        method: 'POST', 
        body: JSON.stringify({
            action: 'addRow', 
            name: nameVal, 
            room: roomVal, 
            phone: document.getElementById('phone').value,
            combinedItems: itemStrings.join(", "), // Combines items into "Item1 (x1), Item2 (x2)"
            totalBill: totalBill
        }) 
    });
    
    // Clear inputs
    document.getElementById('name').value = ""; 
    document.getElementById('room').value = ""; 
    document.getElementById('phone').value = "";
    loadData(); 
}

function render() {
    // --- 1. STOCK ---
    let invVal = 0; let invHtml = "";
    inventory.forEach(i => {
        invVal += (i.qty * i.cost);
        invHtml += `<tr><td>${i.name}</td><td>${i.qty}</td><td>K${i.cost}</td><td>K${(i.qty*i.cost).toLocaleString()}</td>
        <td><button class="btn btn-sm btn-danger" onclick="deleteInv('${i.name}')">Delete</button></td></tr>`;
    });
    document.getElementById('inventoryTable').innerHTML = invHtml;

    // --- 2. SALES ---
    let debt = 0; let salesHtml = "";
    lastSalesData.forEach(row => {
        // Advanced Profit Logic for combined items
        let totalOrderCost = 0;
        const itemParts = row[4].split(", "); // Split "Item (x1), Item (x2)"
        
        itemParts.forEach(part => {
            const nameMatch = part.match(/^(.*) \(x/);
            const qtyMatch = part.match(/\(x(\d+)\)/);
            if (nameMatch && qtyMatch) {
                const itemName = nameMatch[1];
                const qty = parseFloat(qtyMatch[1]);
                const invItem = inventory.find(i => i.name === itemName);
                if (invItem) totalOrderCost += (invItem.cost * qty);
            }
        });

        const prof = parseFloat(row[5]) - totalOrderCost;
        debt += parseFloat(row[7]);

        salesHtml += `<tr>
            <td>${row[8]}</td>
            <td>
                <strong>${row[1]}</strong>
                <span class="details-sub">Room: ${row[2] || 'N/A'}</span>
                <span class="details-sub">Phone: ${row[3] || 'N/A'}</span>
            </td>
            <td><small>${row[4]}</small></td>
            <td>K${parseFloat(row[5]).toFixed(2)}</td>
            <td><span class="profit-label">K${prof.toFixed(2)}</span></td>
            <td class="text-danger fw-bold">K${parseFloat(row[7]).toFixed(2)}</td>
            <td>
                <button class="btn btn-sm btn-success" onclick="makePayment('${row[0]}')">Pay</button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteSale('${row[0]}')">Delete</button>
            </td>
        </tr>`;
    });
    document.getElementById('dataTable').innerHTML = salesHtml;
    document.getElementById('totalBalance').innerText = "K" + (currentPage === 'sales' ? debt : invVal).toLocaleString();

    // ... (Keep the rest of the render function for checklist) ...
    let checkHtml = "";
    inventory.forEach((item, idx) => {
        checkHtml += `<div class="d-flex align-items-center mb-2 border-bottom pb-2">
            <div class="flex-grow-1">
                <input class="form-check-input item-cb" type="checkbox" value="${item.name}" id="cb${idx}">
                <label class="ms-2" for="cb${idx}">${item.name}</label>
                <span class="order-price-tag">Order Price: K${item.cost}</span>
            </div>
            <input type="number" class="form-control form-control-sm w-25 me-1" placeholder="Sell Price" id="p${idx}">
            <input type="number" class="form-control form-control-sm w-25" value="1" id="q${idx}"></div>`;
    });
    document.getElementById('itemChecklist').innerHTML = checkHtml;
}
