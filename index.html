<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Pro Business Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; padding: 20px; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .total-banner { background: #1e2a38; color: white; padding: 30px; border-radius: 15px; margin-bottom: 25px; position: relative; }
        .blur-text { filter: blur(12px); cursor: pointer; transition: 0.3s; }
        .hidden { display: none; }
        #loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
        }
        .nav-buttons { position: absolute; top: 15px; left: 15px; }
        .logout-btn { position: absolute; top: 15px; right: 15px; }
        .item-scroll-area { max-height: 300px; overflow-y: auto; border: 1px solid #dee2e6; padding: 15px; border-radius: 8px; background: #fff; }
        .search-box { border-radius: 50px; padding: 12px 25px; border: 2px solid #ddd; margin-bottom: 15px; }
        .profit-label { font-weight: bold; color: #27ae60; background: #e8f5e9; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3"><strong>Processing...</strong></p>
</div>

<div class="container">
    <div class="total-banner text-center">
        <div class="nav-buttons">
            <button onclick="showPage('sales')" class="btn btn-sm btn-light">🛒 Sales Desk</button>
            <button onclick="showPage('orders')" class="btn btn-sm btn-warning">📦 Inventory</button>
        </div>
        <button onclick="logout()" class="btn btn-sm btn-danger logout-btn">🔒 Lock</button>
        <p class="mb-1 text-uppercase small" id="bannerTitle">Total Outstanding Debt</p>
        <h1 id="totalBalance" class="blur-text">K0.00</h1>
        <div class="mt-2">
            <button onclick="toggleBalance()" class="btn btn-sm btn-outline-light">Show Figure</button>
            <button onclick="showProfitSummary()" class="btn btn-sm btn-success">Total Profit</button>
        </div>
    </div>

    <!-- SALES PAGE -->
    <div id="salesPage">
        <div class="card p-4">
            <h5 class="mb-3 text-secondary">New Sale Session</h5>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="small fw-bold">Customer Details</label>
                    <input type="text" id="name" class="form-control mb-2" placeholder="Name">
                    <input type="text" id="room" class="form-control mb-2" placeholder="Room">
                    <input type="text" id="phone" class="form-control" placeholder="Phone">
                </div>
                <div class="col-md-9">
                    <label class="small fw-bold">Tick Items, Set Sell Price & Qty</label>
                    <div id="itemChecklist" class="item-scroll-area"></div>
                    <div class="text-end mt-3">
                        <button onclick="addRecord()" class="btn btn-primary px-5">Save Selected Items</button>
                    </div>
                </div>
            </div>
        </div>

        <input type="text" id="searchInput" class="form-control search-box w-100" placeholder="🔍 Search sales history..." onkeyup="filterSales()">

        <div class="card p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr><th>Date</th><th>Customer</th><th>Item(s)</th><th>Total</th><th>Profit</th><th>Balance</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="dataTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- INVENTORY PAGE -->
    <div id="ordersPage" class="hidden">
        <div class="card p-4 border-warning">
            <h5 class="mb-3 text-warning">Inventory Entry (Buying Costs)</h5>
            <div class="row g-3">
                <div class="col-md-4"><input type="text" id="invItemName" class="form-control" placeholder="Item Name"></div>
                <div class="col-md-3"><input type="number" id="invOrderPrice" class="form-control" placeholder="Unit Cost (K)"></div>
                <div class="col-md-2"><input type="number" id="invQty" class="form-control" placeholder="Qty" value="1"></div>
                <div class="col-md-3"><button onclick="addInventory()" class="btn btn-warning w-100">Add to Stock</button></div>
            </div>
        </div>
        <div class="card p-4">
            <h5 class="mb-3 text-secondary">Stock Valuation</h5>
            <table class="table table-hover">
                <thead class="table-light">
                    <tr><th>Item Name</th><th>Qty</th><th>Unit Cost</th><th>Total Value</th><th>Actions</th></tr>
                </thead>
                <tbody id="inventoryTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFFwmoB_J_f5qrkpyUNchc48ic7AoP0WAsckzMJadm4YFvYilHjTqk-EScg3WOODZcCQ/exec"; 
    const MASTER_PASSWORD = "shamenda@1421";
    let inventory = []; let lastSalesData = []; let currentPage = 'sales';

    function checkAuth() {
        if (localStorage.getItem("gadgetProAuth") !== MASTER_PASSWORD) {
            const auth = prompt("Admin Password:");
            if (auth === MASTER_PASSWORD) localStorage.setItem("gadgetProAuth", auth);
            else { document.body.innerHTML = "Unauthorized"; throw new Error(); }
        }
    }
    function logout() { localStorage.removeItem("gadgetProAuth"); location.reload(); }
    checkAuth();

    function showPage(page) {
        currentPage = page;
        document.getElementById('salesPage').classList.toggle('hidden', page !== 'sales');
        document.getElementById('ordersPage').classList.toggle('hidden', page !== 'orders');
        document.getElementById('bannerTitle').innerText = (page === 'sales') ? "Total Outstanding Debt" : "Total Inventory Value";
        loadData();
    }

    async function loadData() {
        toggleLoader(true);
        try {
            const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'readAll'}) });
            const data = await res.json();
            inventory = data.inventory || [];
            lastSalesData = data.sales || [];
            renderInventory(inventory);
            renderSales(lastSalesData);
            updateChecklist(inventory);
        } catch (e) { alert("Error connecting to server."); }
        toggleLoader(false);
    }

    function renderInventory(items) {
        let html = ""; let grandTotal = 0;
        items.forEach(i => {
            const rowVal = (parseFloat(i.cost) || 0) * (parseFloat(i.qty) || 0);
            grandTotal += rowVal;
            html += `<tr><td><strong>${i.name}</strong></td><td>${i.qty}</td><td>K${i.cost}</td><td><strong>K${rowVal.toLocaleString()}</strong></td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="deleteInv('${i.name}')">Delete</button></td></tr>`;
        });
        document.getElementById('inventoryTable').innerHTML = html;
        if (currentPage === 'orders') document.getElementById('totalBalance').innerText = "K" + grandTotal.toLocaleString();
    }

    function updateChecklist(items) {
        const container = document.getElementById('itemChecklist');
        if (items.length === 0) { container.innerHTML = '<p class="text-muted">No stock available.</p>'; return; }
        
        let html = '<div class="row fw-bold mb-2 small text-secondary"><div class="col-6">Item Name</div><div class="col-3">Sell Price</div><div class="col-3">Qty</div></div>';
        items.forEach((item, idx) => {
            html += `
            <div class="col-12 mb-2">
                <div class="d-flex align-items-center border-bottom pb-2">
                    <div class="col-6 d-flex align-items-center">
                        <input class="form-check-input item-cb" type="checkbox" value="${item.name}" data-cost="${item.cost}" id="cb${idx}">
                        <label class="form-check-label ms-2" for="cb${idx}">${item.name}<br><small class="text-muted">Cost: K${item.cost}</small></label>
                    </div>
                    <div class="col-3 px-1"><input type="number" class="form-control form-control-sm" placeholder="K" id="p${idx}"></div>
                    <div class="col-3"><input type="number" class="form-control form-control-sm" value="1" min="1" id="q${idx}"></div>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }

    function renderSales(sales) {
        let html = ""; let totalDebt = 0;
        sales.forEach(row => {
            const baseItemName = row[4].split(" (x")[0];
            const qtyPart = row[4].split("(x")[1];
            const qty = qtyPart ? parseFloat(qtyPart.replace(")", "")) : 1;
            const invItem = inventory.find(i => i.name === baseItemName);
            const profit = (parseFloat(row[5]) || 0) - (invItem ? parseFloat(invItem.cost) * qty : 0);
            totalDebt += (parseFloat(row[7]) || 0);
            
            html += `<tr>
                <td><small>${row[8]}</small></td>
                <td><strong>${row[1]}</strong></td>
                <td>${row[4]}</td>
                <td>K${parseFloat(row[5]).toFixed(2)}</td>
                <td><span class="profit-label">K${profit.toFixed(2)}</span></td>
                <td class="text-danger"><strong>K${parseFloat(row[7]).toFixed(2)}</strong></td>
                <td>
                    <button class="btn btn-sm btn-success me-1" onclick="makePayment('${row[0]}')">Pay</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteSale('${row[0]}')">Del</button>
                </td>
            </tr>`;
        });
        document.getElementById('dataTable').innerHTML = html;
        if (currentPage === 'sales') document.getElementById('totalBalance').innerText = "K" + totalDebt.toLocaleString();
    }

    async function addRecord() {
        const name = document.getElementById('name').value;
        if (!name) { alert("Customer name required."); return; }
        const selected = [];
        document.querySelectorAll('.item-cb').forEach((cb, idx) => {
            if (cb.checked) {
                const sPrice = document.getElementById(`p${idx}`).value;
                if (!sPrice) { alert("Enter selling price for " + cb.value); throw "Error"; }
                selected.push({ name: cb.value, cost: cb.getAttribute('data-cost'), sellingPrice: sPrice, qty: document.getElementById(`q${idx}`).value });
            }
        });
        if (selected.length === 0) { alert("Please tick an item."); return; }
        toggleLoader(true);
        await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({
            action: 'addRow', name, items: selected,
            room: document.getElementById('room').value, phone: document.getElementById('phone').value 
        })});
        document.getElementById('name').value = ""; 
        document.getElementById('room').value = ""; 
        document.getElementById('phone').value = "";
        await loadData();
    }

    function filterSales() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll("#dataTable tr").forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(q) ? "" : "none";
        });
    }

    async function addInventory() {
        const name = document.getElementById('invItemName').value;
        const cost = document.getElementById('invOrderPrice').value;
        const qty = document.getElementById('invQty').value;
        if(!name || !cost) return;
        toggleLoader(true);
        await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'addInventory', name, cost, qty})});
        document.getElementById('invItemName').value = ""; document.getElementById('invOrderPrice').value = "";
        await loadData();
    }

    async function makePayment(id) {
        const amt = prompt("Amount Paid (K):");
        if(amt) { toggleLoader(true); await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'update', id, amount: amt})}); await loadData(); }
    }

    async function deleteSale(id) { if(confirm("Delete this sale?")) { toggleLoader(true); await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'delete', id})}); await loadData(); } }
    async function deleteInv(name) { if(confirm("Delete this stock item?")) { toggleLoader(true); await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'deleteInventory', name})}); await loadData(); } }
    function toggleLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
    function toggleBalance() { document.getElementById('totalBalance').classList.toggle('blur-text'); }
    function showProfitSummary() {
        let t = 0;
        lastSalesData.forEach(row => {
            const base = row[4].split(" (x")[0];
            const qty = row[4].split("(x")[1] ? parseFloat(row[4].split("(x")[1].replace(")", "")) : 1;
            const inv = inventory.find(i => i.name === base);
            t += (parseFloat(row[5]) - (inv ? parseFloat(inv.cost) * qty : 0));
        });
        alert("Total Cumulative Profit: K" + t.toLocaleString());
    }
    loadData();
</script>
</body>
</html>
