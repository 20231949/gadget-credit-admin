<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Pro Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; padding: 20px; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .total-banner { background: #1e2a38; color: white; padding: 30px; border-radius: 15px; margin-bottom: 25px; position: relative; }
        .blur-text { filter: blur(12px); cursor: pointer; transition: 0.3s; }
        .hidden { display: none; }
        #loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
        }
        .item-scroll-area { max-height: 300px; overflow-y: auto; border: 1px solid #dee2e6; padding: 15px; border-radius: 8px; background: #fff; }
        .profit-label { font-weight: bold; color: #27ae60; background: #e8f5e9; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div id="loader"><div class="spinner-border text-primary"></div><p class="mt-2 fw-bold">Processing...</p></div>

<div class="container">
    <!-- Header Banner -->
    <div class="total-banner text-center">
        <div class="position-absolute top-0 start-0 m-3">
            <button onclick="showPage('sales')" class="btn btn-sm btn-light shadow-sm">🛒 Sales Desk</button>
            <button onclick="showPage('orders')" class="btn btn-sm btn-warning shadow-sm">📦 Stock Desk</button>
        </div>
        <button onclick="logout()" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-3">Lock</button>
        <p class="mb-1 text-uppercase small" id="bannerTitle">Total Outstanding Debt</p>
        <h1 id="totalBalance" class="blur-text" onclick="this.classList.toggle('blur-text')">K0.00</h1>
        <div class="mt-2">
            <button onclick="showProfitSummary()" class="btn btn-sm btn-success"> Profit Report</button>
        </div>
    </div>

    <!-- SALES PAGE -->
    <div id="salesPage">
        <div class="card p-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="name" class="form-control mb-2" placeholder="Customer Name">
                    <input type="text" id="room" class="form-control mb-2" placeholder="Room/ID">
                    <input type="text" id="phone" class="form-control" placeholder="Phone">
                </div>
                <div class="col-md-8">
                    <div id="itemChecklist" class="item-scroll-area"></div>
                    <button onclick="addRecord()" class="btn btn-primary w-100 mt-3">Confirm Sale</button>
                </div>
            </div>
        </div>
        <input type="text" id="searchInput" class="form-control mb-3" placeholder="🔍 Search records..." onkeyup="filterSales()">
        <div class="card p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Profit</th><th>Balance</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="dataTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- INVENTORY PAGE -->
    <div id="ordersPage" class="hidden">
        <div class="card p-4 border-warning">
            <h5 class="text-warning mb-3">Register New Stock</h5>
            <div class="row g-3">
                <div class="col-md-4"><input type="text" id="invItemName" class="form-control" placeholder="Item Name"></div>
                <div class="col-md-3"><input type="number" id="invOrderPrice" class="form-control" placeholder="Unit Cost (K)"></div>
                <div class="col-md-2"><input type="number" id="invQty" class="form-control" value="1"></div>
                <div class="col-md-3"><button onclick="addInventory()" class="btn btn-warning w-100">Add to Stock</button></div>
            </div>
        </div>
        <div class="card p-4">
            <table class="table table-hover">
                <thead class="table-light"><tr><th>Item</th><th>Qty</th><th>Cost</th><th>Total Value</th><th>Action</th></tr></thead>
                <tbody id="inventoryTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxSVO4CwXlgmxfMGKjTJISeqqTvyraqK7tsVhjYnk3jmv0I86eKhFllcLNM4WTwFXr-VA/exec"; 
    const MASTER_PASSWORD = "shamenda@1421";
    let inventory = []; let lastSalesData = []; let currentPage = 'sales';

    function checkAuth() {
        if (localStorage.getItem("gadgetProAuth") !== MASTER_PASSWORD) {
            const auth = prompt("Admin Password:");
            if (auth === MASTER_PASSWORD) localStorage.setItem("gadgetProAuth", auth);
            else { document.body.innerHTML = "Unauthorized"; throw new Error(); }
        }
    }
    function logout() { localStorage.removeItem("gadgetProAuth"); location.reload(); }
    checkAuth();

    function showPage(page) {
        currentPage = page;
        document.getElementById('salesPage').classList.toggle('hidden', page !== 'sales');
        document.getElementById('ordersPage').classList.toggle('hidden', page !== 'orders');
        document.getElementById('bannerTitle').innerText = (page === 'sales') ? "Total Outstanding Debt" : "Total Inventory Value";
        loadData();
    }

    async function loadData() {
        toggleLoader(true);
        const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'readAll'}) });
        const data = await res.json();
        inventory = data.inventory || [];
        lastSalesData = data.sales || [];
        render();
        toggleLoader(false);
    }

    function render() {
        // --- 1. DEBT CALCULATION ---
        let totalDebt = 0;
        let salesHtml = "";
        lastSalesData.forEach(row => {
            const baseItemName = row[4].split(" (x")[0];
            const qtyPart = row[4].split("(x")[1];
            const qty = qtyPart ? parseFloat(qtyPart) : 1;
            const invItem = inventory.find(i => i.name === baseItemName);
            const profit = parseFloat(row[5]) - (invItem ? invItem.cost * qty : 0);
            totalDebt += parseFloat(row[7]);
            
            salesHtml += `<tr><td>${row[8]}</td><td><strong>${row[1]}</strong></td><td>${row[4]}</td><td>K${parseFloat(row[5]).toFixed(2)}</td>
            <td><span class="profit-label">K${profit.toFixed(2)}</span></td><td class="text-danger">K${parseFloat(row[7]).toFixed(2)}</td>
            <td><button class="btn btn-sm btn-success" onclick="makePayment('${row[0]}')">Pay</button></td></tr>`;
        });
        document.getElementById('dataTable').innerHTML = salesHtml;

        // --- 2. STOCK VALUATION ---
        let inventoryValue = 0;
        let invHtml = "";
        inventory.forEach(i => {
            const rowVal = i.qty * i.cost;
            inventoryValue += rowVal;
            invHtml += `<tr><td>${i.name}</td><td>${i.qty}</td><td>K${i.cost}</td><td><strong>K${rowVal.toLocaleString()}</strong></td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="deleteInv('${i.name}')">Remove</button></td></tr>`;
        });
        document.getElementById('inventoryTable').innerHTML = invHtml;

        // --- 3. BANNER UPDATE ---
        const bannerVal = (currentPage === 'sales') ? totalDebt : inventoryValue;
        document.getElementById('totalBalance').innerText = "K" + bannerVal.toLocaleString();

        // Update Checklist
        let checkHtml = "";
        inventory.forEach((item, idx) => {
            checkHtml += `
            <div class="d-flex align-items-center mb-2 border-bottom pb-2">
                <div class="flex-grow-1"><input class="form-check-input item-cb" type="checkbox" value="${item.name}" data-cost="${item.cost}" id="cb${idx}">
                <label class="ms-2" for="cb${idx}">${item.name}</label></div>
                <input type="number" class="form-control form-control-sm w-25 me-1" placeholder="Sell K" id="p${idx}">
                <input type="number" class="form-control form-control-sm w-25" value="1" id="q${idx}"></div>`;
        });
        document.getElementById('itemChecklist').innerHTML = checkHtml;
    }

    async function addRecord() {
        const name = document.getElementById('name').value;
        const selected = [];
        document.querySelectorAll('.item-cb').forEach((cb, idx) => {
            if (cb.checked) {
                const sPrice = document.getElementById(`p${idx}`).value;
                if (!sPrice) { alert("Price missing for " + cb.value); return; }
                selected.push({ name: cb.value, sellingPrice: sPrice, qty: document.getElementById(`q${idx}`).value });
            }
        });
        if (!name || selected.length === 0) return;
        toggleLoader(true);
        await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'addRow', name, items: selected, room: document.getElementById('room').value, phone: document.getElementById('phone').value })});
        location.reload();
    }

    async function addInventory() {
        const name = document.getElementById('invItemName').value;
        const cost = document.getElementById('invOrderPrice').value;
        const qty = document.getElementById('invQty').value;
        if(!name || !cost) return;
        toggleLoader(true);
        await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'addInventory', name, cost, qty})});
        location.reload();
    }

    async function makePayment(id) {
        const amt = prompt("Amount Paid (K):");
        if(amt) { toggleLoader(true); await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'update', id, amount: amt})}); loadData(); }
    }

    async function deleteInv(name) { if(confirm("Remove?")) { toggleLoader(true); await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'deleteInventory', name})}); loadData(); } }
    function filterSales() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll("#dataTable tr").forEach(row => row.style.display = row.innerText.toLowerCase().includes(q) ? "" : "none");
    }
    function toggleLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
    function showProfitSummary() {
        let t = 0;
        lastSalesData.forEach(row => {
            const base = row[4].split(" (x")[0];
            const qty = row[4].split("(x")[1] ? parseFloat(row[4].split("(x")[1]) : 1;
            const inv = inventory.find(i => i.name === base);
            t += (parseFloat(row[5]) - (inv ? inv.cost * qty : 0));
        });
        alert(" Total Cumulative Profit: K" + t.toLocaleString());
    }
    loadData();
</script>
</body>
</html>
