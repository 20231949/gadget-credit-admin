<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Pro Business Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .total-banner { background: #1e2a38; color: white; padding: 30px; border-radius: 15px; margin-bottom: 25px; position: relative; }
        .blur-text { filter: blur(10px); cursor: pointer; transition: 0.3s; }
        .hidden { display: none; }
        #loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
        }
        .nav-buttons { position: absolute; top: 15px; left: 15px; }
        .logout-btn { position: absolute; top: 15px; right: 15px; }
        .profit-label { font-weight: bold; color: #27ae60; background: #e8f5e9; padding: 2px 8px; border-radius: 5px; }
        .qty-circle { background: #6c757d; color: white; padding: 2px 7px; border-radius: 50%; font-size: 0.75rem; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3"><strong>Syncing Records...</strong></p>
</div>

<div class="container">
    <div class="total-banner text-center">
        <div class="nav-buttons">
            <button onclick="showPage('sales')" class="btn btn-sm btn-light">🛒 Sales</button>
            <button onclick="showPage('orders')" class="btn btn-sm btn-warning">📦 Inventory</button>
        </div>
        <button onclick="logout()" class="btn btn-sm btn-danger logout-btn">🔒 Lock</button>
        
        <p class="mb-1 text-uppercase small" id="bannerTitle">Total Outstanding Debt</p>
        <h1 id="totalBalance" class="blur-text">K0.00</h1>
        
        <div class="mt-2">
            <button onclick="toggleBalance()" class="btn btn-sm btn-outline-light" id="toggleBtn">Show Value</button>
            <button onclick="showProfitSummary()" class="btn btn-sm btn-success">💰 Total Profit</button>
        </div>
    </div>

    <div id="salesPage">
        <div class="card p-4">
            <h5 class="mb-3 text-secondary">New Sale Record</h5>
            <div class="row g-3">
                <div class="col-md-2"><input type="text" id="name" class="form-control" placeholder="Customer Name"></div>
                <div class="col-md-1"><input type="text" id="room" class="form-control" placeholder="Room"></div>
                <div class="col-md-2"><input type="text" id="phone" class="form-control" placeholder="Phone"></div>
                <div class="col-md-3"><select id="itemSelect" class="form-select"><option value="">Select Item...</option></select></div>
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text">K</span>
                        <input type="number" id="cost" class="form-control" placeholder="Sale Price">
                        <button onclick="addRecord()" class="btn btn-primary">Add Sale</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Customer Info</th>
                            <th>Item</th>
                            <th>Sale Price</th>
                            <th>Profit</th>
                            <th>Balance</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="ordersPage" class="hidden">
        <div class="card p-4 border-warning">
            <h5 class="mb-3 text-warning">Stock Entry</h5>
            <div class="row g-3">
                <div class="col-md-4"><input type="text" id="invItemName" class="form-control" placeholder="Item Name"></div>
                <div class="col-md-3"><input type="number" id="invOrderPrice" class="form-control" placeholder="Unit Order Cost (K)"></div>
                <div class="col-md-2"><input type="number" id="invQty" class="form-control" placeholder="Qty" value="1"></div>
                <div class="col-md-3"><button onclick="addInventory()" class="btn btn-warning w-100">Add to Stock</button></div>
            </div>
        </div>
        <div class="card p-4">
            <h5 class="mb-3 text-secondary">Current Stock Valuation</h5>
            <table class="table table-hover">
                <thead class="table-light">
                    <tr><th>Item Name</th><th>Qty</th><th>Unit Cost</th><th>Total Stock Value</th><th>Action</th></tr>
                </thead>
                <tbody id="inventoryTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzIi1AOWOT9NpKrm0zlzhMHIYx232N8objStFhBCST1luHiR9NWwX7MLniYXdVhgE-pKg/exec";
    const MASTER_PASSWORD = "shamenda@1421";
    let inventory = [];
    let lastSalesData = [];

    // --- SECURITY ---
    function checkAuth() {
        if (localStorage.getItem("gadgetProAuth") !== MASTER_PASSWORD) {
            const auth = prompt("Admin Password:");
            if (auth === MASTER_PASSWORD) localStorage.setItem("gadgetProAuth", auth);
            else { document.body.innerHTML = "Unauthorized Access"; throw new Error(); }
        }
    }
    function logout() { localStorage.removeItem("gadgetProAuth"); location.reload(); }
    checkAuth();

    // --- NAVIGATION ---
    function showPage(page) {
        document.getElementById('salesPage').classList.toggle('hidden', page !== 'sales');
        document.getElementById('ordersPage').classList.toggle('hidden', page !== 'orders');
        document.getElementById('bannerTitle').innerText = (page === 'sales') ? "Total Outstanding Debt" : "Total Inventory Value";
        loadData();
    }

    // --- DATA ---
    async function loadData() {
        toggleLoader(true);
        try {
            const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'readAll'}) });
            const data = await res.json();
            inventory = data.inventory || [];
            lastSalesData = data.sales || [];
            renderInventory(inventory);
            renderSales(lastSalesData);
            updateDropdown(inventory);
        } catch (e) { console.error(e); }
        toggleLoader(false);
    }

    function renderInventory(items) {
        let html = ""; let grandTotalValue = 0;
        items.forEach(i => {
            const unitCost = parseFloat(i.cost) || 0;
            const qty = parseFloat(i.qty) || 0;
            const lineTotal = unitCost * qty;
            grandTotalValue += lineTotal;

            html += `<tr>
                <td><strong>${i.name}</strong></td>
                <td><span class="qty-circle">${qty}</span></td>
                <td>K${unitCost}</td>
                <td><strong>K${lineTotal.toLocaleString()}</strong></td>
                <td><button class="btn btn-sm btn-outline-danger" onclick="deleteInv('${i.name}')">Del</button></td>
            </tr>`;
        });
        document.getElementById('inventoryTable').innerHTML = html;
        if (!document.getElementById('ordersPage').classList.contains('hidden')) {
            document.getElementById('totalBalance').innerText = "K" + grandTotalValue.toLocaleString();
        }
    }

    function renderSales(sales) {
        let html = ""; let totalDebt = 0;
        sales.forEach(row => {
            const invItem = inventory.find(i => i.name === row[4]);
            const orderPrice = invItem ? parseFloat(invItem.cost) : 0;
            const salePrice = parseFloat(row[5]) || 0;
            const profit = salePrice - orderPrice;
            totalDebt += parseFloat(row[7]);
            
            html += `<tr>
                <td><small>${row[8]}</small></td>
                <td><strong>${row[1]}</strong><br><small class="text-muted">Rm: ${row[2]} | Ph: ${row[3]}</small></td>
                <td>${row[4]}</td>
                <td>K${salePrice}</td>
                <td><span class="profit-label">K${profit}</span></td>
                <td class="text-danger font-weight-bold">K${row[7]}</td>
                <td>
                    <button class="btn btn-sm btn-success mb-1" onclick="makePayment('${row[0]}')">Pay</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteSale('${row[0]}')">Del</button>
                </td>
            </tr>`;
        });
        document.getElementById('dataTable').innerHTML = html;
        if (!document.getElementById('salesPage').classList.contains('hidden')) {
            document.getElementById('totalBalance').innerText = "K" + totalDebt.toLocaleString();
        }
    }

    // --- ACTIONS ---
    function showProfitSummary() {
        let total = 0;
        lastSalesData.forEach(row => {
            const invItem = inventory.find(i => i.name === row[4]);
            const orderPrice = invItem ? parseFloat(invItem.cost) : 0;
            total += (parseFloat(row[5]) - orderPrice);
        });
        alert("💰 Total Realized Profit: K" + total.toLocaleString());
    }

    async function addInventory() {
        const name = document.getElementById('invItemName').value;
        const cost = document.getElementById('invOrderPrice').value;
        const qty = document.getElementById('invQty').value;
        if (!name || !cost) return;
        toggleLoader(true);
        await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'addInventory', name, cost, qty}) });
        location.reload();
    }

    async function addRecord() {
        toggleLoader(true);
        const payload = {
            action: 'addRow',
            name: document.getElementById('name').value, room: document.getElementById('room').value,
            phone: document.getElementById('phone').value, item: document.getElementById('itemSelect').value, cost: document.getElementById('cost').value
        };
        await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
        location.reload();
    }

    async function makePayment(id) {
        const amt = prompt("Amount Paid:");
        if (amt) {
            toggleLoader(true);
            await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'update', id: id, amount: amt}) });
            loadData();
        }
    }

    async function deleteSale(id) { if(confirm("Delete Sale?")) { toggleLoader(true); await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'delete', id: id}) }); loadData(); } }
    async function deleteInv(name) { if(confirm("Delete Item?")) { toggleLoader(true); await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: 'deleteInventory', name: name}) }); loadData(); } }

    function toggleLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
    function toggleBalance() { const b = document.getElementById('totalBalance'); b.classList.toggle('blur-text'); }
    function updateDropdown(items) {
        const s = document.getElementById('itemSelect'); s.innerHTML = '<option value="">Select Item...</option>';
        items.forEach(i => s.innerHTML += `<option value="${i.name}">${i.name}</option>`);
    }

    loadData();
</script>
</body>
</html>
